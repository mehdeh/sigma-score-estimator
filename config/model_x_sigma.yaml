# Configuration for omega(x, sigma) model - image and sigma input

model:
  type: "omega_x_sigma"
  backbone: "resnet18"

noise:
  sigma_min: 0.01
  sigma_max: 10.0
  strategy: "log_uniform"  # Log-uniform sampling for better coverage
  num_samples: 100

training:
  loss_type: "omega_hat"  # Options: "omega_hat", "omega_epsilon", "omega_chi_zscore"
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0
  scheduler: "cosine"
  scheduler_params:
    T_max: 100
  early_stopping: true
  patience: 10

data:
  batch_size: 128
  num_workers: 4
  train_val_split: [0.85, 0.10]
  test_split: 0.05
  data_root: "./data"

checkpoint:
  save_format: "pkl"
  save_best: true

logging:
  log_interval: 100
  plot_interval: 1

device: "cuda"
seed: 42

