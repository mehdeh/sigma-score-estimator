# Default configuration for sigma-score-estimator

# Model configuration
model:
  type: "omega_x_sigma"  # Options: "omega_x", "omega_x_sigma"
  backbone: "resnet18"

# Noise generation configuration
noise:
  sigma_min: 0.00001  # 1e-5, matching original draft notebook
  sigma_max: 4.0  # matching original draft notebook  
  strategy: "uniform"  # Options: "uniform", "log_uniform", "select_batch"
  num_samples: 100  # Number of pre-filtered samples for select_batch strategy

# Training configuration
training:
  loss_type: "omega_hat"  # Options: "omega_hat", "omega_epsilon", "omega_chi_approx", 
                          #          "omega_chi_mean", "sigma_direct", "sigma_normalized",
                          #          "sigma_relative", "sigma_calibrated", "omega_chi_zscore"
  sigma_cal: 0.0  # Calibration parameter for sigma_calibrated loss
  epochs: 100
  
  # Optimizer configuration
  optimizer: "adam"  # Options: "adam", "sgd"
  optimizer_params:
    # Adam parameters
    betas: [0.9, 0.999]
    eps: 1.0e-8
    # SGD parameters
    momentum: 0.9
    nesterov: true
  
  learning_rate: 0.001
  weight_decay: 0.0
  
  # Learning rate scheduler configuration
  scheduler: "cosine"  # Options: "cosine", "step", "none"
  scheduler_params:
    # For cosine scheduler: T_max should be >= total epochs to avoid LR cycling
    # Set to null to automatically use the epochs value
    T_max: null  # Will default to epochs if null
    # For step scheduler
    step_size: 30
    gamma: 0.1
  
  early_stopping: true
  patience: 10  # Number of epochs to wait before early stopping

# Data configuration
data:
  batch_size: 128
  num_workers: 4
  train_val_split: [0.85, 0.10]  # [train_ratio, val_ratio]
  test_split: 0.05
  data_root: "./data"

# Checkpoint configuration
checkpoint:
  save_format: "pkl"  # Options: "pkl", "pth"
  save_best: true  # Save best model based on validation loss
  save_every: 10  # Save checkpoint every N epochs

# Logging configuration
logging:
  log_interval: 100  # Log training stats every N batches
  plot_interval: 1  # Generate plots every N epochs

# Device and seed
device: "cuda"  # Options: "cuda", "cpu"
seed: 42

