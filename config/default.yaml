# Default configuration for sigma-score-estimator

# Model configuration
model:
  type: "omega_x_sigma"  # Options: "omega_x", "omega_x_sigma"
  backbone: "resnet18"

# Noise generation configuration
noise:
  sigma_min: 0.01  # Tested and works well with omega_chi_zscore
  sigma_max: 10.0  # Tested and works well with omega_chi_zscore
  strategy: "uniform"  # Options: "uniform", "log_uniform", "select_batch"
  num_samples: 100  # Number of pre-filtered samples for select_batch strategy

# Training configuration
training:
  loss_type: "omega_chi_zscore"  # Options: "omega_hat", "omega_epsilon", "omega_chi_zscore"
  epochs: 100
  
  # Performance optimizations (critical for A100/high-end GPUs)
  use_amp: true  # Automatic Mixed Precision - HIGHLY RECOMMENDED for A100 (2-3x speedup)
  use_compile: false  # PyTorch 2.0+ torch.compile (experimental, can provide additional speedup)
  
  # Optimizer configuration (both Adam and SGD tested and work well)
  optimizer: "adam"  # Options: "adam" (recommended), "sgd" (also works well)
  optimizer_params:
    # Adam parameters (default, works well)
    betas: [0.9, 0.999]
    eps: 1.0e-8
    # SGD parameters (if using SGD: --optimizer sgd)
    momentum: 0.9
    nesterov: true
  
  learning_rate: 0.001  # Tested: works well with both Adam and SGD
  weight_decay: 0.0
  
  # Learning rate scheduler (improves convergence)
  scheduler: "cosine"  # Options: "cosine" (recommended), "step", "none"
  scheduler_params:
    # For best results: T_max = epochs OR T_max = epochs/2 (for LR cycling)
    # T_max < epochs can help escape local minima (tested successfully)
    T_max: 100  # Set this equal to epochs, or epochs/2 for 200-epoch training
    step_size: 30  # For step scheduler
    gamma: 0.1
  
  early_stopping: false  # Set to false for full training (tested successfully)
  patience: 10  # Number of epochs to wait before early stopping

# Data configuration
data:
  batch_size: 256  # Increased for A100 (has 40GB+ memory) - adjust based on your GPU
  num_workers: 8  # Increased for better data loading throughput (adjust based on CPU cores)
  train_val_split: [0.85, 0.10]  # [train_ratio, val_ratio]
  test_split: 0.05
  data_root: "./data"
  # Note: For A100 with 40GB+ memory, you can try batch_size up to 512 or higher
  # For RTX 2080 Ti with 11GB, use batch_size: 128-192

# Checkpoint configuration
checkpoint:
  save_format: "pkl"  # Options: "pkl", "pth"
  save_best: true  # Save best model based on validation loss

# Logging configuration
logging:
  log_interval: 200  # Log training stats every N batches
  plot_interval: 5  # Generate plots every N epochs

# Device and seed
device: "cuda"  # Options: "cuda", "cpu"
seed: 42

