# Example configurations for different loss types
# Copy one of these configurations to create your own custom config

# ============================================================================
# AVAILABLE LOSS TYPES
# ============================================================================
# 1. omega_hat: Original formulation - Direct estimation of omega
# 2. omega_epsilon: Epsilon-based formulation - More numerically stable
# 9. omega_chi_zscore: Chi-squared z-score - Normalized learning target
# ============================================================================

# ---------------------------------------------------------------------------
# Loss Type 1: omega_hat (Original Formulation)
# ---------------------------------------------------------------------------
# Target: ||x - x̃||² / σ³
# Description: Baseline formulation without approximations
# Output: Model directly outputs omega (no transformation needed)
# ---------------------------------------------------------------------------
omega_hat_config:
  model:
    type: "omega_x_sigma"
    backbone: "resnet18"
  
  noise:
    sigma_min: 0.01
    sigma_max: 10.0
    strategy: "uniform"
  
  training:
    loss_type: "omega_hat"
    epochs: 100
    learning_rate: 0.001
    optimizer: "adam"
    weight_decay: 0.0
    scheduler: "cosine"
    scheduler_params:
      T_max: 100
    early_stopping: false
  
  data:
    batch_size: 128
    num_workers: 4
    train_val_split: [0.85, 0.10]
    test_split: 0.05
    data_root: "./data"
  
  checkpoint:
    save_format: "pkl"
    save_best: true
    save_every: 10
  
  logging:
    log_interval: 100
    plot_interval: 1
  
  device: "cuda"
  seed: 42

# ---------------------------------------------------------------------------
# Loss Type 2: omega_epsilon (Epsilon-Based)
# ---------------------------------------------------------------------------
# Target: ||ε||² / σ
# Description: More numerically stable for small sigma values
# Output: Model directly outputs omega (no transformation needed)
# Recommended: Use log_uniform noise sampling for better coverage
# ---------------------------------------------------------------------------
omega_epsilon_config:
  model:
    type: "omega_x_sigma"
    backbone: "resnet18"
  
  noise:
    sigma_min: 0.00001  # Can use smaller values due to numerical stability
    sigma_max: 4.0
    strategy: "log_uniform"  # Recommended for this loss
  
  training:
    loss_type: "omega_epsilon"
    epochs: 100
    learning_rate: 0.001
    optimizer: "adam"
    weight_decay: 0.0
    scheduler: "cosine"
    scheduler_params:
      T_max: 100
    early_stopping: false
  
  data:
    batch_size: 128
    num_workers: 4
    train_val_split: [0.85, 0.10]
    test_split: 0.05
    data_root: "./data"
  
  checkpoint:
    save_format: "pkl"
    save_best: true
    save_every: 10
  
  logging:
    log_interval: 100
    plot_interval: 1
  
  device: "cuda"
  seed: 42

# ---------------------------------------------------------------------------
# Loss Type 9: omega_chi_zscore (Chi-Squared Z-Score)
# ---------------------------------------------------------------------------
# Target: (||ε||² - d) / √(2d)
# Description: Model learns normalized z-score of chi-squared distribution
# Output Transformation: omega = (output * √(2d) + d) / σ
# Advantage: Normalized target with zero mean and unit variance
# Note: Transformation is applied during inference, not during training
# ---------------------------------------------------------------------------
omega_chi_zscore_config:
  model:
    type: "omega_x_sigma"
    backbone: "resnet18"
  
  noise:
    sigma_min: 0.01
    sigma_max: 10.0
    strategy: "uniform"
  
  training:
    loss_type: "omega_chi_zscore"
    epochs: 200  # May benefit from longer training
    learning_rate: 0.001
    optimizer: "adam"
    weight_decay: 0.0
    scheduler: "cosine"
    scheduler_params:
      T_max: 100  # Can use T_max < epochs for LR cycling
    early_stopping: false
  
  data:
    batch_size: 128
    num_workers: 4
    train_val_split: [0.85, 0.10]
    test_split: 0.05
    data_root: "./data"
  
  checkpoint:
    save_format: "pkl"
    save_best: true
    save_every: 10
  
  logging:
    log_interval: 100
    plot_interval: 1
  
  device: "cuda"
  seed: 42

# ============================================================================
# USAGE INSTRUCTIONS
# ============================================================================
# 
# To use one of these configurations:
# 
# 1. Copy the desired configuration block to a new file:
#    cp config/loss_examples.yaml config/my_experiment.yaml
# 
# 2. Edit the file to include only the configuration you want
# 
# 3. Run training:
#    python main.py train --config config/my_experiment.yaml
# 
# Or use command-line overrides:
#    python main.py train --config config/default.yaml --loss-type omega_epsilon
# 
# ============================================================================
# RECOMMENDATIONS
# ============================================================================
# 
# - For baseline experiments: Use omega_hat
# - For small sigma values: Use omega_epsilon (more numerically stable)
# - For normalized learning: Use omega_chi_zscore (stable training dynamics)
# 
# All three loss types have been tested and work well with the default
# hyperparameters. The omega_chi_zscore loss type may benefit from longer
# training (200 epochs) and LR cycling (T_max < epochs).
# 
# ============================================================================
